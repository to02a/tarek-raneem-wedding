name: Optimize wedding site assets

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/optimize_assets.py"
      - ".github/workflows/optimize-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimize embedded floral images
        run: python scripts/optimize_assets.py

      - name: Commit optimized assets
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard 'floral-*.webp')" ]; then
            echo "No optimization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html floral-*.webp
          git commit -m "Optimize floral assets for bandwidth"
          git push
