<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>إحصائيات دعوة طارق ورنيم</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#f6f1e8}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#222722;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.card{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#fffaf3;
  border:1px solid rgba(172,131,53,.35);
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 18px 60px rgba(88,70,40,.10);
  text-align:center;
}
h1{font-size:26px;margin:0 0 24px;color:#8b6725}
.big{font-size:58px;font-weight:700;color:#6a4f1f;line-height:1}
.label{color:#6b6a64;margin-top:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.box{padding:18px 10px;border-top:1px solid rgba(172,131,53,.28)}
.num{font-size:30px;font-weight:700}
.note{font-size:13px;color:#777;margin-top:22px;line-height:1.7}
.err{color:#8a2c2c;min-height:18px}
@media(max-width:430px){
  body{padding:14px}
  .card{padding:24px 16px;border-radius:20px}
  h1{font-size:23px}
  .big{font-size:52px}
  .grid{gap:8px}
  .num{font-size:27px}
}
</style>
</head>
<body>
<div class="card">
  <h1>إحصائيات دعوة طارق ورنيم</h1>
  <div class="big" id="total">—</div>
  <div class="label">إجمالي تقديري حتى الآن</div>

  <div class="grid">
    <div class="box">
      <div class="num">≈ 90</div>
      <div class="label">قبل بدء التتبع</div>
    </div>
    <div class="box">
      <div class="num" id="tracked">—</div>
      <div class="label">منذ إصلاح العداد</div>
    </div>
  </div>

  <div class="note">
    الرقم 90 تقديري للزيارات السابقة. من الآن يُحتسب الزائر الجديد بشكل مجهول مع تقليل التكرار قدر الإمكان.
  </div>
  <div class="note err" id="err"></div>
</div>

<script>
function weddingCounterLoaded(data){
  const total = Number(data && data.value);
  if(Number.isFinite(total)){
    document.getElementById('total').textContent = total.toLocaleString('en-US');
    document.getElementById('tracked').textContent = Math.max(0,total-90).toLocaleString('en-US');
    document.getElementById('err').textContent = '';
  }else{
    document.getElementById('err').textContent = 'تعذر قراءة العداد الآن.';
  }
}
</script>
<script async src="https://counterapi.com/api/tarek-raneem.com/view/wedding-2026-v3?readOnly=true&startNumber=90&unique=true&callback=weddingCounterLoaded"></script>
<noscript>فعّل JavaScript لعرض الإحصائيات.</noscript>
</body>
</html>
