<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إحصائيات دعوة طارق ورنيم</title>
<style>
body{margin:0;background:#f6f1e8;color:#222722;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
.card{width:min(92vw,520px);background:#fffaf3;border:1px solid rgba(172,131,53,.35);border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(88,70,40,.10);text-align:center}
h1{font-size:26px;margin:0 0 24px;color:#8b6725}.big{font-size:58px;font-weight:700;color:#6a4f1f}.label{color:#6b6a64;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.box{padding:18px 10px;border-top:1px solid rgba(172,131,53,.28)}.num{font-size:30px;font-weight:700}.note{font-size:13px;color:#777;margin-top:22px;line-height:1.7}.err{color:#8a2c2c}
</style>
</head>
<body>
<div class="card">
<h1>إحصائيات دعوة طارق ورنيم</h1>
<div class="big" id="total">—</div>
<div class="label">إجمالي تقديري حتى الآن</div>
<div class="grid">
<div class="box"><div class="num">≈ 90</div><div class="label">قبل بدء التتبع</div></div>
<div class="box"><div class="num" id="tracked">—</div><div class="label">منذ تركيب العداد</div></div>
</div>
<div class="note">الرقم 90 تقديري للزيارات السابقة. من تاريخ إصلاح العداد، يُحتسب كل متصفح/جهاز مرة واحدة قدر الإمكان، لذلك الرقم ليس سجلًا شخصيًا للأفراد.</div>
<div class="note err" id="err"></div>
</div>
<script>
(async()=>{
 const totalEl=document.getElementById('total'), trackedEl=document.getElementById('tracked'), err=document.getElementById('err');
 try{
   const u='https://counterapi.com/api/tarek-raneem.com/visit/wedding-2026-v2?readOnly=true&startNumber=90&_='+Date.now();
   const r=await fetch(u,{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status);
   const j=await r.json();
   const total=Number(j.value||90);
   totalEl.textContent=total.toLocaleString('en-US');
   trackedEl.textContent=Math.max(0,total-90).toLocaleString('en-US');
 }catch(e){
   err.textContent='تعذر تحميل الرقم الآن. حاول تحديث الصفحة.';
 }
})();
</script>
</body>
</html>
