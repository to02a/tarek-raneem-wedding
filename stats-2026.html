<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>إحصائيات دعوة طارق ورنيم</title>
<script src="https://counterapi.com/c.js?ns=tarek-raneem.com" async></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%}
body{
  min-height:100svh;
  background:#f6f1e8;
  color:#222722;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  display:grid;
  place-items:center;
  padding:16px;
  overflow-x:hidden
}
.card{
  width:min(100%,520px);
  margin:0 auto;
  background:#fffaf3;
  border:1px solid rgba(172,131,53,.35);
  border-radius:24px;
  padding:28px 20px;
  box-shadow:0 18px 60px rgba(88,70,40,.10);
  text-align:center
}
h1{font-size:25px;margin:0 0 28px;color:#8b6725}
.total-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:118px}
.counterapi{
  min-height:64px;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  margin:0 auto!important;
  font-size:58px!important;
  line-height:1!important;
  font-weight:700!important;
  color:#6a4f1f!important;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  padding:0!important
}
.counterapi a{color:#6a4f1f!important;text-decoration:none!important}
.total-label{color:#6b6a64;margin-top:8px}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  margin:26px auto 0;
  max-width:340px;
  border-top:1px solid rgba(172,131,53,.28);
  border-bottom:1px solid rgba(172,131,53,.28)
}
.box{padding:18px 8px}
.num{font-size:30px;font-weight:700}
.label{color:#6b6a64;margin-top:5px}
.note{font-size:13px;color:#777;margin:22px auto 0;line-height:1.75;max-width:420px}
.refresh{
  margin-top:20px;
  border:1px solid #ac8335;
  background:transparent;
  color:#6a4f1f;
  border-radius:999px;
  padding:9px 20px;
  font:inherit;
  cursor:pointer
}
@media(max-width:420px){
  body{padding:12px}
  .card{padding:24px 16px;border-radius:20px}
  h1{font-size:22px}
  .counterapi{font-size:50px!important}
  .num{font-size:27px}
}
</style>
</head>
<body>
<main class="card">
  <h1>إحصائيات دعوة طارق ورنيم</h1>

  <div class="total-wrap">
    <div class="counterapi"
         ns="tarek-raneem.com"
         action="view"
         key="wedding-2026-final"
         readOnly="true"
         startNumber="90"
         noIcon="true"
         noLink="true"
         noCss="true"
         noAnim="true">—</div>
    <div class="total-label">إجمالي الزيارات التقريبي حتى الآن</div>
  </div>

  <div class="grid">
    <div class="box">
      <div class="num">≈ 90</div>
      <div class="label">تقدير الزيارات قبل بدء العداد</div>
    </div>
  </div>

  <button class="refresh" type="button" onclick="location.reload()">تحديث الرقم</button>

  <div class="note">
    الرقم 90 تقديري للزيارات السابقة. العداد الحالي يبدأ من هذا الرقم ويضيف الزيارات الجديدة، مع محاولة تقليل تكرار احتساب نفس الزائر.
  </div>
</main>
</body>
</html>
