<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>إحصائيات دعوة طارق ورنيم</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  min-height:100svh;
  background:#f6f1e8;
  color:#222722;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  overflow-x:hidden
}
.card{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#fffaf3;
  border:1px solid rgba(172,131,53,.35);
  border-radius:24px;
  padding:28px 20px;
  box-shadow:0 18px 60px rgba(88,70,40,.10);
  text-align:center
}
h1{font-size:25px;margin:0 0 28px;color:#8b6725}
.big{font-size:58px;line-height:1;font-weight:700;color:#6a4f1f;min-height:62px;display:flex;align-items:center;justify-content:center}
.total-label{color:#6b6a64;margin-top:8px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:28px auto 0;
  max-width:420px
}
.box{padding:18px 8px;border-top:1px solid rgba(172,131,53,.28)}
.num{font-size:30px;font-weight:700}
.label{color:#6b6a64;margin-top:5px;line-height:1.55}
.note{font-size:13px;color:#777;margin:22px auto 0;line-height:1.75;max-width:420px}
.err{color:#8a2c2c;min-height:18px}
.refresh{
  margin-top:20px;
  border:1px solid #ac8335;
  background:transparent;
  color:#6a4f1f;
  border-radius:999px;
  padding:9px 20px;
  font:inherit;
  cursor:pointer
}
@media(max-width:420px){
  body{padding:12px}
  .card{padding:24px 16px;border-radius:20px}
  h1{font-size:22px}
  .big{font-size:50px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .num{font-size:27px}
  .label{font-size:14px}
}
</style>
</head>
<body>
<main class="card">
  <h1>إحصائيات دعوة طارق ورنيم</h1>
  <div class="big" id="total">…</div>
  <div class="total-label">إجمالي الزيارات التقريبي حتى الآن</div>

  <div class="grid">
    <div class="box">
      <div class="num">≈ 90</div>
      <div class="label">تقدير قبل بدء العداد</div>
    </div>
    <div class="box">
      <div class="num" id="tracked">…</div>
      <div class="label">زيارات جديدة مسجلة</div>
    </div>
  </div>

  <button class="refresh" type="button" onclick="loadStats()">تحديث الرقم</button>
  <div class="note">الـ90 رقم تقديري للزيارات السابقة. الزيارات الجديدة تُضاف فوقه، مع محاولة احتساب كل متصفح/جهاز مرة واحدة قدر الإمكان.</div>
  <div class="note err" id="err"></div>
</main>

<script>
async function loadStats(){
  const totalEl=document.getElementById('total');
  const trackedEl=document.getElementById('tracked');
  const err=document.getElementById('err');
  totalEl.textContent='…';
  trackedEl.textContent='…';
  err.textContent='';
  try{
    const r=await fetch('https://abacus.jasoncameron.dev/get/tarek-raneem-2026/wedding-home?ts='+Date.now(),{
      mode:'cors',
      cache:'no-store',
      credentials:'omit'
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const tracked=Number(j.value||0);
    if(!Number.isFinite(tracked)) throw new Error('Bad value');
    trackedEl.textContent=tracked.toLocaleString('en-US');
    totalEl.textContent=(90+tracked).toLocaleString('en-US');
  }catch(e){
    totalEl.textContent='90+';
    trackedEl.textContent='—';
    err.textContent='تعذر قراءة العداد الآن. الموقع نفسه شغال بشكل طبيعي.';
  }
}
loadStats();
</script>
</body>
</html>
